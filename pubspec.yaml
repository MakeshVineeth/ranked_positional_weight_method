name: ranked_positional_method
description: Offline assembly line balancing calculator using the Ranked Positional Weight (RPW) method.
publish_to: 'none'
version: 3.0.0+2

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  go_router: ^18.1.4
  material_ui: ^1.11.1
  provider: ^6.1.0
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/logo.png"
  web:
    generate: true
    image_path: "assets/logo.png"
  windows:
    generate: true
    image_path: "assets/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
