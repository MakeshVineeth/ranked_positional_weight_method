name: ranked_positional_method
description: Offline assembly line balancing calculator using the Ranked Positional Weight (RPW) method.
publish_to: 'none'
version: 3.0.0+2

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  go_router: ^18.1.4
  material_ui: ^1.11.1
  provider: ^6.1.0
  shared_preferences: ^2.3.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_launcher_icons: ^0.14.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon_launcher.png"
  min_sdk_android: 24
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo.png"
  adaptive_icon_foreground_inset: 24
  adaptive_icon_monochrome: "assets/icon_monochrome.png"
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
  web:
    generate: true
    image_path: "assets/icon_launcher.png"
    background_color: "#FAF8FF"
    theme_color: "#3F51B5"
  windows:
    generate: true
    image_path: "assets/icon_launcher.png"

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
